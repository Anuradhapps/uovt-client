name: Deploy Next.js Jobs Frontend

on:
  push:
    branches:
      - feature/authentication
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js application
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}

      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Prepare EC2 directory
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key "$EC2_USER@$EC2_HOST" \
            'mkdir -p /home/ubuntu/apps/uovt-jobs-frontend'

      - name: Copy standalone build to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          rsync -az -e "ssh -i ~/.ssh/deploy_key" \
            .next/standalone/ \
            "$EC2_USER@$EC2_HOST:/home/ubuntu/apps/uovt-jobs-frontend/"

          ssh -i ~/.ssh/deploy_key "$EC2_USER@$EC2_HOST" \
            'mkdir -p /home/ubuntu/apps/uovt-jobs-frontend/.next/static'

          rsync -az -e "ssh -i ~/.ssh/deploy_key" \
            .next/static/ \
            "$EC2_USER@$EC2_HOST:/home/ubuntu/apps/uovt-jobs-frontend/.next/static/"

          if [ -d public ]; then
            rsync -az -e "ssh -i ~/.ssh/deploy_key" \
              public/ \
              "$EC2_USER@$EC2_HOST:/home/ubuntu/apps/uovt-jobs-frontend/public/"
          fi

      - name: Restart application
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key "$EC2_USER@$EC2_HOST" \
            'cd /home/ubuntu/apps/uovt-jobs-frontend &&
             (PORT=3001 pm2 restart uovt-jobs-frontend --update-env ||
              PORT=3001 pm2 start server.js --name uovt-jobs-frontend) &&
             pm2 save'

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
