name: Deploy UOVT Next.js Frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uovt-frontend-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js application
        run: npm run build

      - name: Prepare standalone deployment
        run: |
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/static

          if [ -d public ]; then
            cp -r public .next/standalone/public
          fi

          tar -czf deploy.tar.gz -C .next/standalone .

      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key

          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload production build
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          scp -i ~/.ssh/ec2_key \
            deploy.tar.gz \
            "$EC2_USER@$EC2_HOST:/tmp/uovt-frontend.tar.gz"

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/ec2_key "$EC2_USER@$EC2_HOST" 'bash -s' <<'REMOTE'
          set -e

          APP_DIR=/home/ubuntu/uovt-deploy

          mkdir -p "$APP_DIR"

          pm2 delete uovt-frontend || true

          find "$APP_DIR" -mindepth 1 -maxdepth 1 \
            -exec rm -rf {} +

          tar -xzf /tmp/uovt-frontend.tar.gz -C "$APP_DIR"
          rm -f /tmp/uovt-frontend.tar.gz

          cd "$APP_DIR"

          PORT=3001 HOSTNAME=127.0.0.1 \
            pm2 start "$APP_DIR/server.js" \
            --name uovt-frontend \
            --cwd "$APP_DIR"

          pm2 save

          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:3001/ -o /dev/null; then
              echo "Deployment successful"
              exit 0
            fi
            sleep 2
          done

          pm2 logs uovt-frontend --lines 50 --nostream
          exit 1
          REMOTE
